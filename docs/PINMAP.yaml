# Teryx EV MASTER PIN MAP — single source of truth.
# Generated from this file: docs/PINMAP.md, docs/CONNECTIONS.md, checklist.html "Connections" tab,
# wire numbers on tools/wiring.html and schematic/gen.py. Edit HERE, then run tools/build_pinmap.py.
# Checked against firmware by scripts/test_pinmap.py (fails on any mismatch).
#
# status: SOURCED (cite file:line or doc) | ASSUMED | PROPOSED | UNVERIFIED | UNDEFINED (no pin/part chosen yet)
# tier:   CRITICAL (needed for first drive) | LATER
# step (build order): 1 12 V + grounds · 2 Teensys · 3 CAN · 4 BICMs · 5 ESP32 gateway
#                     6 safety I/O + Kelly low voltage · 7 HV (LATER, Sparky present) · 8 body/aux (LATER)
# kind: wire (you crimp it) | board (on a perfboard/daughterboard) | factory (existing harness) | none (wireless / software line)
meta:
  repo_commit_basis: "cd7027f + Build 10 BMS settings"
  firmware_pins: include/Config.h namespace Pins (lines 157-271)
  can_map: include/FlexCanCompat.h:41-60 (CAN_LAYOUT_V2=1, default when DUAL_STRING=1)
  boards: {A: "Teensy 4.1 A, env teensy41_dual_a (TEENSY_ROLE=0) — BMS master, contactors, throttle",
           B: "Teensy 4.1 B, env teensy41_dual_b (TEENSY_ROLE=1) — watchdog, can only open/cap",
           E: "ESP32 DevKit gateway (teryx-ev-hub firmware/esp32-gateway), read-only"}

colors:   # PROPOSED colour code (not in any doc except the factory BICM harness)
  status: PROPOSED
  "+12V unswitched": RD
  "+12V switched/fused feed": RD/WH
  "12V coil feed (after e-stop)": RD/YE
  GND: BK
  "+5V": OR
  "+3V3": OR/WH
  CAN-H: YE
  CAN-L: GN
  "analog signal": BU
  "digital input": BU/BK
  "heartbeat / enable": VT
  "UART": WH
  HV+: "orange HV cable, RED tape"
  HV-: "orange HV cable, BLACK tape"
gauges:   # PROPOSED gauge scheme
  status: PROPOSED
  signal / CAN / UART: "22 AWG (CAN = twisted pair, ~1 twist per inch)"
  "5 V / 3.3 V logic power": "20 AWG"
  "12 V coil feeds, relay coils, KSI": "18 AWG"
  "12 V branch to Kelly PWR / electronics box": "16 AWG"
  "12 V main (DC-DC out)": "UNDEFINED — size to the DC-DC output fuse (Sparky)"
  HV: "1/0 AWG (docs/WIRING.md) — CONFLICT with 3/0 in old schematic/gen.py, Sparky to decide"

