  - {id: CAN-B1, board: B, ctrl: CAN1, tx: 22, rx: 23, bitrate: 125000, frame: 11-bit, nodes: "Teensy B + String 3 BICMs", ids: "factory IDs", term: "120 Ω both ends", transceiver: "SN65HVD230 #3", src: "include/FlexCanCompat.h:43", status: SOURCED}
