conflicts:   # pin / doc conflicts found while building this map (see docs/PINMAP.md)
  - "A pins 16/17 are both IN2/IN1 (Config.h:159-160) and Serial4 RX/TX for the ESP32 (HubStatus.cpp:12). Resolved in code (BmsApp.cpp:12 never pinModes them) — IN1/IN2 are unavailable as inputs. OK, but never wire anything else to 16/17."
  - "A pins 18/19 are IN3/IN4 (Config.h:161-162) and I2C SDA/SCL for the MCP23017 (Config.h:228-229, BODY_IO_EXPANDER=1). Intentional; IN3/IN4 are not usable as inputs on A."
  - "Pin 4: A_THR_ALIVE on A, B_FAULT_OUT on B; pin 7: RAD_FAN on A, B_THR_ALIVE on B; pin 40: PEDAL_IN_A on A, ST_4WD_B on B; pin 41: POS_4WD on A, PEDAL_IN_B on B. Not clashes (different boards) — label every harness wire by board (TA/TB)."
  - "E-stop block 3 -> Teensy B input pin is UNDEFINED in firmware (docs/ESTOP.md 'pin TBD'; EstopLatch.h not called). PROPOSED B pin 9."
  - "12 V low alarm: REQUIRED before first drive but no pin. Teensy A has NO free analog pin. PROPOSED Teensy B pin 26 (A12)."
  - "ESP32 GPIO17: teryx-ev-hub firmware/esp32-gateway/docs/PINMAP.md says GPIO17 TX <- Teensy RX 16 (crossed pair); GATEWAY.md:18 says leave unconnected (RX-only). This map follows GATEWAY.md (newer, matches code TX pin = -1). Hub PINMAP.md also still says pins 0/1 are 'CAN2 Elcon + Kelly @250k' and 'Soft-AP out of scope' — both stale."
  - "src/HubStatus.cpp:14 comment says pins 0/1 are Elcon+Kelly CAN2; CAN_LAYOUT_V2 (FlexCanCompat.h:44) makes them string-2 BICM @125k. Comment stale."
  - "include/Config.h:37 comment says B CAN3 = link only; FlexCanCompat.h:45 has B on the shared 250k vehicle bus (Kelly + Elcon + link). Follow FlexCanCompat."
  - "Old wiring overview drew park on 'pin 18'; park is pin 32 on A and B (Config.h:249,253). Fixed in the drawing."
  - "Precharge relay: Config.h:183 says TE EV11 / K1KABNA; WIRING/SAFETY/COMPONENTS say AEV14012."
  - "HV string lead gauge 1/0 (WIRING.md) vs 3/0 (old gen.py)."
  - "SN65HVD230: 6 needed (CAN_LAYOUT_V2), COMPONENTS.md lists 4 owned."
  - "Config.h:217 says PEDAL_IN_B reads 'same pedal wiper'; crew agreed a second (half-scale) track — chief review #9."
