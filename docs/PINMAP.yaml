  - {id: CAN-A1, board: A, ctrl: CAN1, tx: 22, rx: 23, bitrate: 125000, frame: 11-bit, nodes: "Teensy A + String 1 BICMs (M2 24S + M4 c1-12)", ids: "0x460-0x47E BICM reports; 0x200/0x300/0x310 keep-alive/balance (TX only if flags)", term: "120 Ω at Teensy transceiver + BICM end (BICM-end built-in UNVERIFIED: meter ~60 Ω powered off)", transceiver: "SN65HVD230 #1", src: "include/FlexCanCompat.h:43; include/Config.h:9; include/StringConfig.h:11-15", status: SOURCED}
