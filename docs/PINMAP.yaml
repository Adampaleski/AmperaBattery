  - {id: CAN-V, board: "A+B", ctrl: CAN3, tx: 31, rx: 30, bitrate: 250000, frame: "29-bit (Kelly/Elcon) + 11-bit (A-B link)", nodes: "Teensy A (end, 120 Ω) · Teensy B (stub, no 120 Ω) · Kelly · Elcon (far end 120 Ω, built-in UNVERIFIED)", ids: "Kelly 0x0CF11E05/0x0CF11F05 (include/KellyLink.h:4); Elcon 0x1806E5F4 / 0x18FF50E5 (Config.h:88, StringConfig.h:81); link 0x6A0-0x6A4 B->A, 0x6A8-0x6AA A->B (StringConfig.h:83-93)", term: "120 Ω at Teensy A and at the far end only", transceiver: "SN65HVD230 #5 (A), #6 (B) — 2 more than COMPONENTS.md lists owned", src: "include/FlexCanCompat.h:45", status: SOURCED}

