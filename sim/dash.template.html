<!doctype html>
<!-- Teryx in-vehicle dash. GENERATED by scripts/build_bms_sim_html.sh from sim/dash.template.html + sim/dash.js.
     Read-only display in real mode; with ?src=sim it drives the simulator (Sim tab or in-page engine). Data source configurable (see docs/DASH.md). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" id="vp" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* Fit-to-screen (Build 8): on small screens lay the dash out at a fixed design width (1280 landscape / 820 portrait)
   and let the browser scale it to fit. Pinch-zoom and pan stay enabled (no maximum-scale / user-scalable=no). */
(function(){const vp=document.getElementById('vp');function fit(){const sw=Math.min(screen.width,screen.height),lw=Math.max(screen.width,screen.height);
  const port=matchMedia('(orientation: portrait)').matches,W=port?820:1280,dev=port?sw:lw;
  document.documentElement.style.setProperty('--tnk',dev<W?String(W/dev):'1');vp.setAttribute('content',dev<W?'width='+W+',viewport-fit=cover':'width=device-width,initial-scale=1,viewport-fit=cover');}
 fit();addEventListener('orientationchange',()=>setTimeout(fit,50));matchMedia('(orientation: portrait)').addEventListener('change',fit);})();</script>
<meta name="theme-color" content="#000"><title>Teryx Dash</title>
<style>html,body{margin:0;background:#000;min-height:100%;overflow:auto;-webkit-text-size-adjust:100%;touch-action:manipulation}
#dash .tdash.full{height:calc(100vh - 48px*var(--tnk,1) - env(safe-area-inset-top))}
@media(max-width:900px){#dash .tdash .dock .seatb{flex:1 0 22%}}</style></head><body>@@TOPNAV@@
<div id="dash"></div>
<script>@@VEHICLE_JS@@</script>
<script>@@DASH_JS@@</script>
<script>
/* Source layer: ?src=sim | http://…/api/status | ws://… | none  (saved in localStorage 'teryxDashSrc') */
const q=new URLSearchParams(location.search);
let cfg=JSON.parse(localStorage.getItem('teryxDashSrc')||'{"src":"sim","url":""}');
if(q.get('src')){const s=q.get('src');cfg=/^wss?:/.test(s)?{src:'ws',url:s}:/^https?:/.test(s)?{src:'http',url:s}:{src:s,url:cfg.url};}
// Sim quick panel only with ?src=sim (commands go back to the open simulator tab); never in real mode.
// Build 15 (iPhone): eng = the sim running inside this page (hidden frame). Commands go to it when it runs.
let cmdBC=null,eng=null;const simPanel=cfg.src==='sim'?{send:(cmd,v)=>{if(eng){try{eng.contentWindow.postMessage({teryxCmd:{cmd,v}},'*');}catch(e){}return;}try{(cmdBC||(cmdBC=new BroadcastChannel('teryx-dash-cmd'))).postMessage({cmd,v});}catch(e){}}}:null;
const dash=TeryxDash.create(document.getElementById('dash'),{full:true,sourceUI:true,simPanel});
let last=null,lastAt=0,timer=null,ws=null,bc=null;
const STALE_MS=3000;
function got(s){if(s&&s.schema===1){last=s;lastAt=Date.now();}}
function stop(){clearInterval(timer);timer=null;if(ws){ws.close();ws=null;}if(bc){bc.close();bc=null;}}
function start(){stop();last=null;
  if(cfg.src==='sim'){bc=new BroadcastChannel('teryx-dash');bc.onmessage=e=>got(e.data);}
  else if(cfg.src==='http'&&cfg.url){const poll=()=>fetch(cfg.url,{cache:'no-store'}).then(r=>r.json()).then(got).catch(()=>{});poll();timer=setInterval(poll,500);}
  else if(cfg.src==='ws'&&cfg.url){const open=()=>{ws=new WebSocket(cfg.url);ws.onmessage=e=>{try{got(JSON.parse(e.data));}catch(_){}};ws.onclose=()=>{if(cfg.src==='ws')setTimeout(()=>{if(cfg.src==='ws'&&(!ws||ws.readyState>1))open();},2000);};};open();}
  dash.F('url')&&(dash.F('url').value=cfg.url||'');
  document.querySelectorAll('[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===cfg.src));
}
window.addEventListener('message',e=>{if(cfg.src!=='sim')return;const m=e.data||{};
  if(eng&&e.source===eng.contentWindow){engMsg(m);if(m.schema===1)engHello=true;}
  got(m);});   // window.open() from the sim, or the in-page engine
/* ---- In-page sim engine (Build 15, for iPhone) ----
   iOS Safari freezes background tabs, so a Sim tab cannot feed this page on a phone. With ?src=sim, if no Sim tab answers
   within 2.5 s (or it goes quiet later), the sim is loaded hidden inside this page and runs here. Its PIN pads and pop-ups
   show on this dash. ?engine=page forces it, ?engine=tab never uses it. The SIMULATOR panel is the control drawer. */
const engMode=(q.get('engine')||'auto').toLowerCase();let engHello=false,engWhy='',engPads={},engPend={},engTries=[];
function engPost(m){try{eng&&eng.contentWindow.postMessage(m,'*');}catch(e){}}
function engMsg(m){
  if(m.teryxEngine==='hello'){engHello=true;engPaint();}
  else if(m.teryxToast){TeryxPad.toast(m.teryxToast);try{dash.toast&&dash.toast(m.teryxToast);}catch(e){}}
  else if(m.teryxPad){const {id,title,note}=m.teryxPad;engPads.cur=id;
    TeryxPad.open({title,note,onEnter:pin=>new Promise(res=>{engPend[id]=res;engPost({teryxPadEnter:{id,pin}});}),onCancel:()=>{engPads.cur=null;engPost({teryxPadCancel:id});}});}
  else if(m.teryxPadResult){const {id,err}=m.teryxPadResult;const r=engPend[id];delete engPend[id];if(r)r(err);}
  else if(m.teryxPadClose!=null){if(engPads.cur===m.teryxPadClose&&TeryxPad.isOpen()){engPads.cur=null;TeryxPad.close();}}}
function startPageEngine(why){if(eng||!simPanel)return;engWhy=why;if(bc){bc.close();bc=null;}
  engTries=location.protocol==='file:'?['bms_sim.html','index.html']:['index.html','bms_sim.html'];
  const load=()=>{const src=engTries.shift();if(!src)return;eng.src=src+'?embed=1';
    setTimeout(()=>{if(!engHello&&engTries.length)load();},4000);};
  eng=document.createElement('iframe');eng.id='simEngine';eng.title='Simulator engine running in this page';
  eng.setAttribute('aria-hidden','true');eng.tabIndex=-1;eng.style.cssText='position:fixed;width:1px;height:1px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(eng);load();engPaint();}
function engPaint(){const e=dash.F&&dash.F('seng');if(!e)return;
  e.textContent=eng?(engHello?'Sim engine: running in this page (no Sim tab needed)':'Sim engine: starting in this page…'):(last?'Sim engine: the Sim tab':'Sim engine: waiting for the Sim tab…');
  const b=dash.F('sengb');if(b)b.style.display=eng?'none':'';}
// "Full sim controls": shows the full simulator over the dash (starts the in-page engine if needed). Close returns to the dash.
let engX=null;function engFull(on){if(on&&!eng)startPageEngine('full controls');if(!eng)return;
  if(on){eng.style.cssText='position:fixed;left:0;right:0;bottom:0;top:calc(56px*var(--tnk,1) + env(safe-area-inset-top));width:100%;height:calc(100% - 56px*var(--tnk,1) - env(safe-area-inset-top));border:0;z-index:9000;background:#fff';eng.removeAttribute('aria-hidden');
    if(!engX){engX=document.createElement('button');engX.textContent='✕ Back to dash';engX.setAttribute('data-f','sengx');
      engX.style.cssText='position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:9001;min-height:calc(44px*var(--tnk,1));padding:0 calc(16px*var(--tnk,1));border-radius:12px;border:0;background:#3e6ae1;color:#fff;font:600 calc(17px*var(--tnk,1)) system-ui;touch-action:manipulation';
      engX.onclick=()=>engFull(false);document.body.appendChild(engX);}engX.style.display='';}
  else{eng.style.cssText='position:fixed;width:1px;height:1px;left:-10px;top:-10px;border:0;opacity:0;pointer-events:none';eng.setAttribute('aria-hidden','true');if(engX)engX.style.display='none';}}
if(simPanel){const b=dash.F('sengb');if(b)b.onclick=()=>startPageEngine('button');const f=dash.F('sengf');if(f)f.onclick=()=>engFull(true);
  if(engMode==='page')startPageEngine('engine=page');
  else if(engMode!=='tab'){const t0=Date.now();setInterval(()=>{if(eng)return;const quiet=!last?Date.now()-t0>2500:Date.now()-lastAt>2500;
    if(quiet&&cfg.src==='sim')startPageEngine(last?'Sim tab went quiet':'no Sim tab answered');engPaint();},500);}}
document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{cfg.src=b.dataset.src;document.querySelectorAll('[data-src]').forEach(x=>x.classList.toggle('on',x===b));});
dash.F('apply').onclick=()=>{cfg.url=dash.F('url').value.trim();localStorage.setItem('teryxDashSrc',JSON.stringify(cfg));start();};
start();
setInterval(()=>{const stale=!last||Date.now()-lastAt>STALE_MS;dash.update(stale?null:last,{});},100);
// ?src=sim: heartbeat so the sim keeps running even when its tab is in the background (browsers slow hidden-tab timers).
if(simPanel)setInterval(()=>simPanel.send('tick'),100);
</script></body></html>
