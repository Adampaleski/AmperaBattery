; Ampera / Volt BICM — Teensy 4.1
; Default: one K112 BICM monitoring a 24S sub-pack (6+12+6 on X1–X4).

[platformio]
default_envs = teensy41_k112_24s

[common]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Use CLI uploader (close serial monitor first). teensy-gui often fails headless.
upload_protocol = teensy-cli
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git

[env:teensy41_sniffer]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4

[env:teensy41_bms]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=0
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4
    -D ENABLE_BMS_CONTACTORS=1

; One physical K112 BICM, 24S sub-pack (modules 9+8+7 style, 6+12+6 cells on CAN).
[env:teensy41_k112_24s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_24S_SUBPACK=1
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=3

; Legacy: four separate 6S slaves on CAN (full 24S pack, four boards).
[env:teensy41_1bicm]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=6
    -D PACK_MODULE_COUNT=1
