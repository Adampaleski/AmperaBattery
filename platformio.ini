; Ampera / Volt BICM — Teensy 4.1 (24S / 4×6S)
; Default env: bench sniffer + decode. teensy41_bms adds gated contactor outputs.

[platformio]
default_envs = teensy41_sniffer

[common]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Use CLI uploader (close serial monitor first). teensy-gui often fails headless.
upload_protocol = teensy-cli
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git

[env:teensy41_sniffer]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4

[env:teensy41_bms]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=0
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4
    -D ENABLE_BMS_CONTACTORS=1

; Bench with only ONE physical BICM on the bus (6 cells, not 24).
[env:teensy41_1bicm]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=6
    -D PACK_MODULE_COUNT=1
