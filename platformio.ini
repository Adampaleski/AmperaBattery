; Ampera / Volt BICM — Teensy 4.1
; Default: one K112 BICM monitoring a 24S sub-pack (6+12+6 on X1–X4).

[platformio]
default_envs = teensy41_k112_24s

[common]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Use CLI uploader (close serial monitor first). teensy-gui often fails headless.
upload_protocol = teensy-cli
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git

[env:teensy41_sniffer]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4

[env:teensy41_bms]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=0
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=4
    -D ENABLE_BMS_CONTACTORS=1

; One physical K112 BICM, 24S sub-pack (modules 9+8+7 style, 6+12+6 cells on CAN).
[env:teensy41_k112_24s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_PACK_DECODE=1
    -D PACK_BICM_COUNT=1
    -D PACK_S_CELLS=24
    -D PACK_MODULE_COUNT=1

; K112A 24S + K112B 12S on one daisy chain (36S string).
; TELEMETRY_ONLY stays 1 — charge/contactor code is compiled but flags stay 0.
[env:teensy41_k112_36s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_PACK_DECODE=1
    -D PACK_BICM_COUNT=2
    -D PACK_S_CELLS=36
    -D PACK_MODULE_COUNT=2
    -D K112_SPARSE_SECOND_BICM=1

; Probe: one 0x460/0x470 stream, accumulate up to 48 cells (both blocks on one ID pair).
[env:teensy41_k112_48s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_PACK_DECODE=1
    -D PACK_BICM_COUNT=1
    -D PACK_S_CELLS=48
    -D PACK_MODULE_COUNT=1

; Bench: one as-pulled Volt section (30S) on its own BICM, 0x460/0x470.
[env:teensy41_bench_30s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_PACK_DECODE=1
    -D PACK_BICM_COUNT=1
    -D PACK_S_CELLS=30
    -D PACK_MODULE_COUNT=1

; Bench: two 30S sections, one BICM each, daisy-chained (2x30s, never in series).
[env:teensy41_bench_2x30s]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D K112_PACK_DECODE=1
    -D PACK_BICM_COUNT=2
    -D PACK_CELLS_PER_BICM=30
    -D PACK_S_CELLS=60
    -D PACK_MODULE_COUNT=2

; Factory bus: up to four Volt BICMs (module 1-4, factory ID straps) on ONE
; CAN3 bus @125k. Channel -> pack-cell map in include/FactoryCellMap.h
; (default: every channel of M1-M4 mapped, display slots 1-96). PACK_S_CELLS must equal
; FACTORY_PACK_CELLS there. Monitor only.
[env:teensy41_factory_bus]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D FACTORY_BUS_DECODE=1
    -D K112_PACK_DECODE=0
    -D PACK_S_CELLS=96
    -D PACK_MODULE_COUNT=4

; Legacy: four separate 6S slaves on CAN (full 24S pack, four boards).
[env:teensy41_1bicm]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D BICM_CELLS_PER_MODULE=6
    -D PACK_S_CELLS=6
    -D PACK_MODULE_COUNT=1

; Dual-string 36S 4P: two Teensy 4.1s, each CAN3 = string 1, CAN1 (22/23) =
; string 2, CAN2 = Elcon + Kelly + link (StringConfig.h). Monitor / print-only.
[env:teensy41_dual_a]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D FACTORY_BUS_DECODE=1
    -D K112_PACK_DECODE=0
    -D PACK_S_CELLS=96
    -D PACK_MODULE_COUNT=4
    -D DUAL_STRING=1
    -D TEENSY_ROLE=0

[env:teensy41_dual_b]
extends = common
build_flags =
    -D USB_SERIAL
    -D TELEMETRY_ONLY=1
    -D FACTORY_BUS_DECODE=1
    -D K112_PACK_DECODE=0
    -D PACK_S_CELLS=96
    -D PACK_MODULE_COUNT=4
    -D DUAL_STRING=1
    -D TEENSY_ROLE=1
