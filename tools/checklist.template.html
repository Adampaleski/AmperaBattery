<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teryx EV — Checklist</title>
<style>
:root{--bg:#0b0c0e;--card:#16181c;--line:#2a2d33;--tx:#e8eaed;--mut:#8a9099;--red:#e82127;--amb:#f5a623;--grn:#3ecf6e;--blu:#3e6ae1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(11,12,14,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px calc(10px) ;padding-top:max(10px,env(safe-area-inset-top))}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:960px;margin:auto}
h1{font-size:18px;font-weight:600;letter-spacing:.04em;margin:0;flex:1}
nav a{color:var(--mut);text-decoration:none;margin-right:12px;font-size:14px}nav a.on{color:var(--tx);border-bottom:2px solid var(--blu)}
button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
main{max-width:960px;margin:auto;padding:12px 16px 60px}
.note{color:var(--mut);font-size:13px;margin:6px 0 14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;padding:4px 14px 8px}
.sec.req{border-color:var(--red)}.sec.req h2{color:#ff6b6f}.sec.buy h2{color:var(--amb)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;display:flex;justify-content:space-between}
.cnt{color:var(--mut);font-weight:400}
ul{list-style:none;margin:0;padding:0}li{border-top:1px solid var(--line);padding:10px 0}
label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
input[type=checkbox]{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--grn)}
li.done .t{color:var(--mut);text-decoration:line-through}
.m{margin:4px 0 0 36px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px}
.own{background:#22324f;color:#b8c9ff;border-radius:10px;padding:1px 8px}.src{color:var(--mut)}
.hide li.done{display:none}
@media print{header nav,button{display:none}body{background:#fff;color:#000;font-size:11pt}header{position:static;background:#fff;border:0}
.sec{background:#fff;border:1px solid #999;break-inside:auto}.sec h2,.sec.req h2,.sec.buy h2{color:#000}li{border-color:#ccc;break-inside:avoid}
.own{background:none;color:#000;border:1px solid #999}.src{color:#444}input[type=checkbox]{accent-color:#000}.hide li.done{display:block}}
</style></head><body>
<header><div class="hd"><h1>TERYX EV · CHECKLIST</h1>
<nav><a href="index.html">Simulator</a><a href="dash.html">Dash</a><a href="wiring.html">Wiring</a><a class="on" href="checklist.html">Checklist</a></nav>
<button id="hide">Hide done</button><button onclick="print()">Print</button></div></header>
<main><p class="note"><!--TOTAL--> open items, generated by tools/build_checklist.py from BACKLOG.md + teryx-shop-log.md (OPEN only). Ticks are saved on this device only. Owner tag · source. Buy list: nothing is bought without Adam's OK.</p>
<!--BODY-->
</main>
<script>
const K='teryx-checklist-v1',st=JSON.parse(localStorage.getItem(K)||'{}');
function upd(){document.querySelectorAll('ul[data-sec]').forEach(u=>{const b=u.querySelectorAll('input'),d=[...b].filter(x=>x.checked).length;document.querySelector('.cnt[data-sec="'+u.dataset.sec+'"]').textContent=d+'/'+b.length})}
document.querySelectorAll('input[data-id]').forEach(c=>{c.checked=!!st[c.dataset.id];c.closest('li').classList.toggle('done',c.checked);
c.onchange=()=>{st[c.dataset.id]=c.checked;if(!c.checked)delete st[c.dataset.id];localStorage.setItem(K,JSON.stringify(st));c.closest('li').classList.toggle('done',c.checked);upd()}});
document.getElementById('hide').onclick=e=>{document.body.classList.toggle('hide');e.target.textContent=document.body.classList.contains('hide')?'Show done':'Hide done'};upd();
</script></body></html>
