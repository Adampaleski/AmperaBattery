const NS="http://www.w3.org/2000/svg",isR=s=>s!=="S";
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
function draw(pg,svg,thumb){svg.setAttribute("viewBox",`0 0 ${pg.w} ${pg.h}`);const N={};pg.nodes.forEach(n=>N[n[0]]=n);
 const cx=n=>[n[2]+n[4]/2,n[3]+n[5]/2];
 // Drawing standard (Adam, Build 2): wires that cross without connecting get a HOP arc on the horizontal wire;
 // a real junction (two wires leaving the same terminal and splitting) gets a FILLED DOT. No bare 4-way crossings.
 const W=[];pg.wires.forEach(([a,b,l,r])=>{const A=N[a],B=N[b];if(!A||!B)return;let[x1,y1]=cx(A),[x2,y2]=cx(B);
  const pts=Math.abs(x2-x1)>Math.abs(y2-y1)?[[A[2]+(x2>x1?A[4]:0),y1],[(x1+x2)/2,y1],[(x1+x2)/2,y2],[B[2]+(x2>x1?0:B[4]),y2]]:[[x1,A[3]+(y2>y1?A[5]:0)],[x1,(y1+y2)/2],[x2,(y1+y2)/2],[x2,B[3]+(y2>y1?0:B[5])]];
  W.push({a,b,l,r,pts,x1,y1,x2,y2,hops:[]})});
 // unrelated wires must never run on top of each other (reads as one wire): nudge the movable middle run
 const ovl=(p,q,r,t)=>{const H=p[1]===q[1]&&r[1]===t[1]&&p[1]===r[1],V=p[0]===q[0]&&r[0]===t[0]&&p[0]===r[0];if(!H&&!V)return false;const c=H?0:1;
  return Math.min(Math.max(p[c],q[c]),Math.max(r[c],t[c]))-Math.max(Math.min(p[c],q[c]),Math.min(r[c],t[c]))>1};
 const clash=(w,lim)=>W.slice(0,lim).some(o=>![o.a,o.b].some(x=>x===w.a||x===w.b)&&[0,1,2].some(k=>[0,1,2].some(m=>ovl(w.pts[k],w.pts[k+1],o.pts[m],o.pts[m+1]))));
 W.forEach((w,j)=>{const c=w.pts[1][0]===w.pts[2][0]?0:1,base=w.pts[1][c];for(let t=1;t<9&&clash(w,j);t++){const d=(t%2?1:-1)*12*Math.ceil(t/2);w.pts[1][c]=base+d;w.pts[2][c]=base+d;}});
 svg._W=W;
 const segs=w=>w.pts.slice(1).map((q,i)=>({p:w.pts[i],q,h:Math.abs(w.pts[i][1]-q[1])<1e-6&&Math.abs(w.pts[i][0]-q[0])>1e-6,v:Math.abs(w.pts[i][0]-q[0])<1e-6&&Math.abs(w.pts[i][1]-q[1])>1e-6,i})),M=6,R=6,dots=[];
 const inside=(v,a,b,m)=>v>Math.min(a,b)+m&&v<Math.max(a,b)-m;
 W.forEach((wi,i)=>W.forEach((wj,j)=>{if(i===j)return;const share=wi.a===wj.a||wi.a===wj.b||wi.b===wj.a||wi.b===wj.b;
  segs(wi).filter(s=>s.h).forEach(H=>segs(wj).filter(s=>s.v).forEach(V=>{const x=V.p[0],y=H.p[1];
   if(inside(x,H.p[0],H.q[0],M)&&inside(y,V.p[1],V.q[1],M))wi.hops.push([H.i,x]);                 // true crossing: hop
   else if(inside(x,H.p[0],H.q[0],M)&&(Math.abs(V.p[1]-y)<1e-6||Math.abs(V.q[1]-y)<1e-6)){if(share)dots.push([x,y]);else wi.hops.push([H.i,x]);}   // T: junction only if same terminal
  }))}));
 // overlapping runs from a shared terminal that split = real junction (filled dot at the split)
 W.forEach((wi,i)=>W.forEach((wj,j)=>{if(j<=i)return;if(!(wi.a===wj.a||wi.b===wj.b||wi.a===wj.b||wi.b===wj.a))return;
  for(let k=1;k<3;k++){const P=wi.pts[k];if(wj.pts.some((Q,m)=>m>0&&m<3&&Math.abs(Q[0]-P[0])<1e-6&&Math.abs(Q[1]-P[1])<1e-6)&&JSON.stringify(wi.pts[k+1])!==JSON.stringify(wj.pts[k+1]))dots.push(P)}}));
 W.forEach(w=>{let d=`M${w.pts[0][0]} ${w.pts[0][1]}`;w.pts.slice(1).forEach((q,i)=>{const p=w.pts[i];
   const hs=w.hops.filter(h=>h[0]===i).map(h=>h[1]).filter((x,k,a)=>a.indexOf(x)===k),dir=q[0]>=p[0]?1:-1;hs.sort((u,v)=>(u-v)*dir);
   hs.forEach(x=>{d+=` L${x-R*dir} ${p[1]} A${R} ${R} 0 0 ${dir>0?1:0} ${x+R*dir} ${p[1]}`});d+=` L${q[0]} ${q[1]}`});
  el("path",{d,class:"w"+(w.r?" r":"")},svg);if(w.l&&!thumb){const t=el("text",{x:(w.x1+w.x2)/2+4,y:(w.y1+w.y2)/2-4,class:"wl"+(w.r?" r":"")},svg);t.textContent=w.l+(w.r?" (UNVERIFIED)":"")}});
 const seen={};dots.forEach(([x,y])=>{const k=x+","+y;if(seen[k])return;seen[k]=1;el("circle",{cx:x,cy:y,r:4.5,class:"jd"},svg)});
 svg.dataset.hops=W.reduce((s,w)=>s+w.hops.length,0);svg.dataset.dots=Object.keys(seen).length;
 pg.nodes.forEach(n=>{const[id,lab,x,y,w,h,s]=n,k=typeof n[7]==="string"?n[7]:"",hd=k==="hdr";const lt=k==="later",g=el("g",{class:"n"+(hd?" h":"")+(isR(s)&&!hd?" r":"")+(lt?" lt":k&&!hd?" l":"")},svg);
  el("rect",{x,y,width:w,height:h},g);const L=lab.split("|");if(isR(s)&&!hd&&!thumb)L[0]+=s==="P"?"  [PROPOSED]":"  [UNVERIFIED]";
  L.forEach((s2,i)=>{const t=el("text",{x:x+8,y:y+18+i*16,class:"t"+i},g);t.textContent=s2});
  if(!thumb&&!hd&&svg.isConnected){const mw=Math.max(...[...g.querySelectorAll("text")].map(q=>q.getComputedTextLength()))+34;if(mw>w)g.firstChild.setAttribute("width",mw)}
  g.dataset.id=id;if(k&&!hd&&!lt){const t=el("text",{x:x+Math.max(w,+g.firstChild.getAttribute("width"))-20,y:y+18},g);t.textContent="⤢";g.onclick=()=>location.hash=k}
  const ps=!hd&&!thumb?nodeParts(n):[];if(ps.length){g.dataset.part=ps.join(" ");g.style.cursor="pointer";const t=el("text",{x:x+8,y:y+h-6,style:"font-size:10px;fill:#8ab4ff"},g);t.textContent="ⓘ part";g.onclick=e=>{e.stopPropagation();openNodeParts(ps,k,nodeBoard(n))}}
  const bd=!hd&&!thumb?nodeBoard(n):"";if(bd){g.dataset.board=bd;const tp=g.querySelector("text[style*='8ab4ff']");if(tp){tp.style.cursor="pointer";tp.onclick=e=>{e.stopPropagation();openNodeParts(ps,k,bd)}}
   const tb=el("text",{x:x+70,y:y+h-6,style:"font-size:10px;fill:#ffcf8a"},g);tb.textContent="▦ perf-board layout";g.onclick=e=>{e.stopPropagation();location.href="perfboard.html?board="+encodeURIComponent(bd)}}});}
// A node's {board:"<id>"} -> tools/perfboard.html?board=<id> (docs/boards/<id>.layout.json): clicking the node opens the layout, "ⓘ part" still opens the part card.
function nodeBoard(n){for(let i=7;i<n.length;i++){const o=n[i];if(o&&typeof o==="object"&&!Array.isArray(o)&&o.board)return o.board}return ""}
// Explicit part ids: a node's trailing {part:"id"|["id",..]} -> window.PARTS (tools/parts.js <- docs/PARTS.yaml). No text matching.
function nodeParts(n){for(let i=7;i<n.length;i++){const o=n[i];if(o&&typeof o==="object"&&!Array.isArray(o)&&o.part!=null)return [].concat(o.part)}return []}
function csFor(pid){return (window.CUTSHEETS||[]).find(c=>c.id===pid||(c.also_parts||[]).includes(pid))}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function partHtml(c){return `<h3 style="margin:4px 0">${esc(c.name)}</h3><div class="desc">${esc(c.mfr||"")}</div>`+(c.missing?`<p class="miss">NO DATASHEET FOUND: ${esc(c.missing)}</p>`:`<p><b>${esc(c.doc)}</b><br><a href="${c.url}" target="_blank" rel="noopener">${esc(c.url)}</a>${c.mirror?`<br>Copy: <a href="${c.mirror}" target="_blank" rel="noopener">${esc(c.mirror)}</a>`:""}${c.page?`<br>Maker page: <a href="${c.page}" target="_blank" rel="noopener">${esc(c.page)}</a>`:""}</p>${c.note?`<p class="desc">${esc(c.note)}</p>`:""}`)+`<b>Specs (SOURCED from the doc above unless tagged)</b><ul>${(c.specs||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
function partCard(pid){const P=(window.PARTS||{})[pid];if(!P)return `<p class="miss">UNKNOWN PART id "${esc(pid)}" — not in docs/PARTS.yaml (scripts/check_parts.py should have failed)</p>`;
 const st=String(P.status||"");return `<h3 style="margin:4px 0">${esc(P.name)} <span class="desc">[${esc(pid)}]</span></h3><div class="desc">${esc(P.maker||"")} · <b>${esc(P.model||"UNKNOWN")}</b> · qty ${esc(P.qty??"?")} · status <b${/conflict/i.test(st)?' class="miss"':""}>${esc(st)}</b>${P.tier?` · ${esc(P.tier)}`:""}</div>`+
 (P.superseded_by?`<p class="miss">SUPERSEDED by ${esc(P.superseded_by)}</p>`:"")+(P.conflict?`<p class="miss">CONFLICT (${esc(P.conflict.field||"")}): ${(P.conflict.values||[]).map(esc).join(" vs ")}</p>`:"")+
 `<b>Parts list (docs/PARTS.yaml)</b><ul>${(P.specs||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`+(P.open_questions&&P.open_questions.length?`<b>Open</b><ul>${P.open_questions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")}
function openNodeParts(ps,k,bd){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button>`+ps.map(pid=>{const c=csFor(pid);return `<div class="box">${partCard(pid)}${c?`<hr><b>Cut sheet</b>`+partHtml(c):`<p class="desc">No cut sheet linked for this part.</p>`}</div>`}).join("")+(bd?`<p><a href="perfboard.html?board=${encodeURIComponent(bd)}">Open the perf-board layout ▦</a></p>`:"")+(k&&k!=="later"?`<p><a href="#${k}" onclick="pp.classList.remove('on')">Open the sub-schematic ⤢</a></p>`:"");pp.classList.add("on")}
function openPart(c,k){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button>`+partHtml(c)+(k?`<p><a href="#${k}" onclick="pp.classList.remove('on')">Open the sub-schematic ⤢</a></p>`:"");pp.classList.add("on")}
function openParts(){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button><h2 style="margin:4px 0">Parts &amp; cut sheets</h2><p class="desc">Links only (maker copyright, no redistribution licence). Checked 2026-10-22: HTTP 200 + part number in the document.</p>`+CUTSHEETS.map(c=>`<div class="box">${partHtml(c)}</div>`).join("");pp.classList.add("on")}
const TIER=id=>((window.INSTALL||{})[id]||{}).tier||"CRITICAL";let crit=localStorage.getItem("teryx-wiring-crit")!=="0";
function guide(pg){const I=(window.INSTALL||{})[pg.id]||{},parts=[];pg.nodes.forEach(n=>{if(n[6]==="hdr"||n[7]==="hdr")return;nodeParts(n).forEach(pid=>{if(!parts.some(p=>p.pid===pid))parts.push({pid,P:(window.PARTS||{})[pid]||{name:pid},c:csFor(pid),id:n[0]})})});
 const st=s=>`<span class="st ${s}">${{S:"SOURCED",P:"PROPOSED",U:"UNVERIFIED"}[s]||s}</span>`;let h=`<h3>Install guide <span class="tb ${TIER(pg.id)}">${TIER(pg.id)}</span></h3>`+(I.why?`<p class="desc">${esc(I.why)}</p>`:"")+`<ol class="steps">`;
 if(I.safety)h+=`<h4>Safety first</h4>`+I.safety.map(x=>`<li>${esc(x)}</li>`).join("");
 h+=`<h4>Mount</h4>`+(parts.length?parts.map(p=>`<li data-node="${p.id}">Mount <b>${esc(p.P.name)}</b> (${esc(p.P.model||"UNKNOWN")}). Location: <span class="st U">UNVERIFIED</span> (not decided in the shop log). ${[...(p.P.specs||[]),...((p.c&&p.c.specs)||[])].filter(x=>/^mount/i.test(x)).map(esc).join("; ")} <a href="#" onclick="event.stopPropagation();openNodeParts(['${p.pid}']);return false">part</a></li>`).join(""):`<li>No catalogued parts on this page (see the drawing).</li>`);
 h+=`<h4>Wire (from → to)</h4>`+pg.net.map(r=>{const fz=(r[5].match(/[^,;·]*fuse[^,;·]*/i)||[])[0],cn=(r[5].match(/(Deutsch|DT[ -]|Yazaki|Molex|connector)[^,;·]*/i)||[])[0];
  return `<li><b>${esc(r[0])}</b> → <b>${esc(r[1])}</b> · ${esc(r[2])} · gauge ${esc(r[3])} · colour ${esc(r[4])} ${r[3]==="factory"?"(factory)":r[4]==="—"?"":"(PROPOSED code)"} · fuse: ${fz?esc(fz):"none listed"} · connector: ${cn?esc(cn):'<span class="st U">UNVERIFIED</span>'}${r[5]?` · ${esc(r[5])}`:""} ${st(r[6])}</li>`}).join("");
 h+=`<h4>Torque / crimp</h4>`+parts.map(p=>{const t=((p.c&&p.c.specs)||[]).filter(x=>/torque|N·m/i.test(x)&&!/UNVERIFIED/.test(x));return `<li data-node="${p.id}">${esc(p.P.name)}: ${t.length?t.map(esc).join("; ")+' <span class="st S">SOURCED</span>':'torque <span class="st U">UNVERIFIED</span> — read the cut sheet before tightening'}</li>`}).join("")+`<li>Crimps: lugs + crimper not bought yet (buy list); crimp spec per the terminal maker <span class="st U">UNVERIFIED</span></li>`;
 h+=`<h4>Test / verify</h4>`+((I.test||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>None listed yet.</li>");

function tierUi(){const b=document.getElementById("crit");b.textContent=crit?"Critical only ✓":"Showing all";b.classList.toggle("on",crit)}
function panzoom(svg,pg){let vb=[0,0,pg.w,pg.h];const set=()=>svg.setAttribute("viewBox",vb.join(" "));const P=new Map();let d0=0;
 const zoom=(f,cx,cy)=>{const r=svg.getBoundingClientRect(),px=vb[0]+(cx-r.left)/r.width*vb[2],py=vb[1]+(cy-r.top)/r.height*vb[3];vb=[px-(px-vb[0])*f,py-(py-vb[1])*f,vb[2]*f,vb[3]*f];set()};
 svg.onwheel=e=>{e.preventDefault();let dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1);dy=Math.max(-100,Math.min(100,dy));zoom(Math.exp(dy*(e.ctrlKey?.01:.0012)),e.clientX,e.clientY)};
 svg.onpointerdown=e=>{P.set(e.pointerId,[e.clientX,e.clientY]);if(!(e.target.closest&&e.target.closest(".n")))svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);if(P.size===1){const r=svg.getBoundingClientRect();vb[0]-=(e.clientX-o[0])/r.width*vb[2];vb[1]-=(e.clientY-o[1])/r.height*vb[3];set()}
  P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0)zoom(d0/d,(a[0]+b[0])/2,(a[1]+b[1])/2);d0=d}};
 svg.onpointerup=svg.onpointercancel=e=>{P.delete(e.pointerId);d0=0};return{zoom,reset:()=>{vb=[0,0,pg.w,pg.h];set()}}}
function render(){const id=location.hash.slice(1)||"overview",pg=PAGES.find(p=>p.id===id)||PAGES[0];
 document.getElementById("nav").innerHTML=PAGES.filter(p=>!crit||TIER(p.id)==="CRITICAL"||p.id===pg.id).map(p=>`<a href="#${p.id}" class="${p.id===pg.id?"on":""}">${p.title}${p.id!=="overview"?` <span class="tb ${TIER(p.id)}">${TIER(p.id)==="CRITICAL"?"C":"L"}</span>`:""}</a>`).join("");tierUi();
