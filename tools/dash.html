<script>
/* Source layer: ?src=sim | http://…/api/status | ws://… | none  (saved in localStorage 'teryxDashSrc') */
const q=new URLSearchParams(location.search);
let cfg=JSON.parse(localStorage.getItem('teryxDashSrc')||'{"src":"sim","url":""}');
if(q.get('src')){const s=q.get('src');cfg=/^wss?:/.test(s)?{src:'ws',url:s}:/^https?:/.test(s)?{src:'http',url:s}:{src:s,url:cfg.url};}
const dash=TeryxDash.create(document.getElementById('dash'),{full:true,sourceUI:true});
let last=null,lastAt=0,timer=null,ws=null,bc=null;
const STALE_MS=3000;
function got(s){if(s&&s.schema===1){last=s;lastAt=Date.now();}}
function stop(){clearInterval(timer);timer=null;if(ws){ws.close();ws=null;}if(bc){bc.close();bc=null;}}
function start(){stop();last=null;
  if(cfg.src==='sim'){bc=new BroadcastChannel('teryx-dash');bc.onmessage=e=>got(e.data);}
  else if(cfg.src==='http'&&cfg.url){const poll=()=>fetch(cfg.url,{cache:'no-store'}).then(r=>r.json()).then(got).catch(()=>{});poll();timer=setInterval(poll,500);}
  else if(cfg.src==='ws'&&cfg.url){const open=()=>{ws=new WebSocket(cfg.url);ws.onmessage=e=>{try{got(JSON.parse(e.data));}catch(_){}};ws.onclose=()=>{if(cfg.src==='ws')setTimeout(()=>{if(cfg.src==='ws'&&(!ws||ws.readyState>1))open();},2000);};};open();}
  dash.F('url')&&(dash.F('url').value=cfg.url||'');
  document.querySelectorAll('[data-src]').forEach(b=>b.classList.toggle('on',b.dataset.src===cfg.src));
}
window.addEventListener('message',e=>{if(cfg.src==='sim')got(e.data);});   // window.open() from the sim
document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{cfg.src=b.dataset.src;document.querySelectorAll('[data-src]').forEach(x=>x.classList.toggle('on',x===b));});
dash.F('apply').onclick=()=>{cfg.url=dash.F('url').value.trim();localStorage.setItem('teryxDashSrc',JSON.stringify(cfg));start();dash.F('menu').classList.remove('on');};
start();
setInterval(()=>{const stale=!last||Date.now()-lastAt>STALE_MS;dash.update(stale?null:last,{});},100);
</script></body></html>
