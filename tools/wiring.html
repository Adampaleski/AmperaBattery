 W.forEach((w,j)=>{const c=w.pts[1][0]===w.pts[2][0]?0:1,base=w.pts[1][c];for(let t=1;t<9&&clash(w,j);t++){const d=(t%2?1:-1)*12*Math.ceil(t/2);w.pts[1][c]=base+d;w.pts[2][c]=base+d;}});

function csFor(pid){return (window.CUTSHEETS||[]).find(c=>c.id===pid||(c.also_parts||[]).includes(pid))}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function partHtml(c){return `<h3 style="margin:4px 0">${esc(c.name)}</h3><div class="desc">${esc(c.mfr||"")}</div>`+(c.missing?`<p class="miss">NO DATASHEET FOUND: ${esc(c.missing)}</p>`:`<p><b>${esc(c.doc)}</b><br><a href="${c.url}" target="_blank" rel="noopener">${esc(c.url)}</a>${c.mirror?`<br>Copy: <a href="${c.mirror}" target="_blank" rel="noopener">${esc(c.mirror)}</a>`:""}${c.page?`<br>Maker page: <a href="${c.page}" target="_blank" rel="noopener">${esc(c.page)}</a>`:""}</p>${c.note?`<p class="desc">${esc(c.note)}</p>`:""}`)+`<b>Specs (SOURCED from the doc above unless tagged)</b><ul>${(c.specs||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
function partCard(pid){const P=(window.PARTS||{})[pid];if(!P)return `<p class="miss">UNKNOWN PART id "${esc(pid)}" — not in docs/PARTS.yaml (scripts/check_parts.py should have failed)</p>`;
 const st=String(P.status||"");return `<h3 style="margin:4px 0">${esc(P.name)} <span class="desc">[${esc(pid)}]</span></h3><div class="desc">${esc(P.maker||"")} · <b>${esc(P.model||"UNKNOWN")}</b> · qty ${esc(P.qty??"?")} · status <b${/conflict/i.test(st)?' class="miss"':""}>${esc(st)}</b>${P.tier?` · ${esc(P.tier)}`:""}</div>`+
 (P.superseded_by?`<p class="miss">SUPERSEDED by ${esc(P.superseded_by)}</p>`:"")+(P.conflict?`<p class="miss">CONFLICT (${esc(P.conflict.field||"")}): ${(P.conflict.values||[]).map(esc).join(" vs ")}</p>`:"")+
 `<b>Parts list (docs/PARTS.yaml)</b><ul>${(P.specs||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`+(P.open_questions&&P.open_questions.length?`<b>Open</b><ul>${P.open_questions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")}
function openNodeParts(ps,k){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button>`+ps.map(pid=>{const c=csFor(pid);return `<div class="box">${partCard(pid)}${c?`<hr><b>Cut sheet</b>`+partHtml(c):`<p class="desc">No cut sheet linked for this part.</p>`}</div>`}).join("")+(k&&k!=="later"?`<p><a href="#${k}" onclick="pp.classList.remove('on')">Open the sub-schematic ⤢</a></p>`:"");pp.classList.add("on")}
function openPart(c,k){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button>`+partHtml(c)+(k?`<p><a href="#${k}" onclick="pp.classList.remove('on')">Open the sub-schematic ⤢</a></p>`:"");pp.classList.add("on")}
function openParts(){const pp=document.getElementById("pp");pp.innerHTML=`<button onclick="pp.classList.remove('on')" style="float:right">Close</button><h2 style="margin:4px 0">Parts &amp; cut sheets</h2><p class="desc">Links only (maker copyright, no redistribution licence). Checked 2026-10-22: HTTP 200 + part number in the document.</p>`+CUTSHEETS.map(c=>`<div class="box">${partHtml(c)}</div>`).join("");pp.classList.add("on")}
const TIER=id=>((window.INSTALL||{})[id]||{}).tier||"CRITICAL";let crit=localStorage.getItem("teryx-wiring-crit")!=="0";
function guide(pg){const I=(window.INSTALL||{})[pg.id]||{},parts=[];pg.nodes.forEach(n=>{if(n[6]==="hdr"||n[7]==="hdr")return;nodeParts(n).forEach(pid=>{if(!parts.some(p=>p.pid===pid))parts.push({pid,P:(window.PARTS||{})[pid]||{name:pid},c:csFor(pid),id:n[0]})})});
 const st=s=>`<span class="st ${s}">${{S:"SOURCED",P:"PROPOSED",U:"UNVERIFIED"}[s]||s}</span>`;let h=`<h3>Install guide <span class="tb ${TIER(pg.id)}">${TIER(pg.id)}</span></h3>`+(I.why?`<p class="desc">${esc(I.why)}</p>`:"")+`<ol class="steps">`;
 if(I.safety)h+=`<h4>Safety first</h4>`+I.safety.map(x=>`<li>${esc(x)}</li>`).join("");
 h+=`<h4>Mount</h4>`+(parts.length?parts.map(p=>`<li data-node="${p.id}">Mount <b>${esc(p.P.name)}</b> (${esc(p.P.model||"UNKNOWN")}). Location: <span class="st U">UNVERIFIED</span> (not decided in the shop log). ${[...(p.P.specs||[]),...((p.c&&p.c.specs)||[])].filter(x=>/^mount/i.test(x)).map(esc).join("; ")} <a href="#" onclick="event.stopPropagation();openNodeParts(['${p.pid}']);return false">part</a></li>`).join(""):`<li>No catalogued parts on this page (see the drawing).</li>`);
 h+=`<h4>Wire (from → to)</h4>`+pg.net.map(r=>{const fz=(r[5].match(/[^,;·]*fuse[^,;·]*/i)||[])[0],cn=(r[5].match(/(Deutsch|DT[ -]|Yazaki|Molex|connector)[^,;·]*/i)||[])[0];
  return `<li><b>${esc(r[0])}</b> → <b>${esc(r[1])}</b> · ${esc(r[2])} · gauge ${esc(r[3])} · colour ${esc(r[4])} ${r[3]==="factory"?"(factory)":r[4]==="—"?"":"(PROPOSED code)"} · fuse: ${fz?esc(fz):"none listed"} · connector: ${cn?esc(cn):'<span class="st U">UNVERIFIED</span>'}${r[5]?` · ${esc(r[5])}`:""} ${st(r[6])}</li>`}).join("");
 h+=`<h4>Torque / crimp</h4>`+parts.map(p=>{const t=((p.c&&p.c.specs)||[]).filter(x=>/torque|N·m/i.test(x)&&!/UNVERIFIED/.test(x));return `<li data-node="${p.id}">${esc(p.P.name)}: ${t.length?t.map(esc).join("; ")+' <span class="st S">SOURCED</span>':'torque <span class="st U">UNVERIFIED</span> — read the cut sheet before tightening'}</li>`}).join("")+`<li>Crimps: lugs + crimper not bought yet (buy list); crimp spec per the terminal maker <span class="st U">UNVERIFIED</span></li>`;
 h+=`<h4>Test / verify</h4>`+((I.test||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>None listed yet.</li>");
 return h+`</ol>`}
function tierUi(){const b=document.getElementById("crit");b.textContent=crit?"Critical only ✓":"Showing all";b.classList.toggle("on",crit)}
function panzoom(svg,pg){let vb=[0,0,pg.w,pg.h];const set=()=>svg.setAttribute("viewBox",vb.join(" "));const P=new Map();let d0=0;
 const zoom=(f,cx,cy)=>{const r=svg.getBoundingClientRect(),px=vb[0]+(cx-r.left)/r.width*vb[2],py=vb[1]+(cy-r.top)/r.height*vb[3];vb=[px-(px-vb[0])*f,py-(py-vb[1])*f,vb[2]*f,vb[3]*f];set()};
 svg.onwheel=e=>{e.preventDefault();zoom(e.deltaY>0?1.15:0.87,e.clientX,e.clientY)};
 svg.onpointerdown=e=>{P.set(e.pointerId,[e.clientX,e.clientY]);if(!(e.target.closest&&e.target.closest(".n")))svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);if(P.size===1){const r=svg.getBoundingClientRect();vb[0]-=(e.clientX-o[0])/r.width*vb[2];vb[1]-=(e.clientY-o[1])/r.height*vb[3];set()}
  P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d0)zoom(d0/d,(a[0]+b[0])/2,(a[1]+b[1])/2);d0=d}};
 svg.onpointerup=svg.onpointercancel=e=>{P.delete(e.pointerId);d0=0};return{zoom,reset:()=>{vb=[0,0,pg.w,pg.h];set()}}}
function render(){const id=location.hash.slice(1)||"overview",pg=PAGES.find(p=>p.id===id)||PAGES[0];
 document.getElementById("nav").innerHTML=PAGES.filter(p=>!crit||TIER(p.id)==="CRITICAL"||p.id===pg.id).map(p=>`<a href="#${p.id}" class="${p.id===pg.id?"on":""}">${p.title}${p.id!=="overview"?` <span class="tb ${TIER(p.id)}">${TIER(p.id)==="CRITICAL"?"C":"L"}</span>`:""}</a>`).join("");tierUi();
 const m=document.getElementById("m");m.innerHTML=`<h2 style="margin:6px 0">${pg.title}</h2><div class="desc">${pg.desc}</div><div class="view" style="--ar:${pg.w}/${pg.h}"><svg></svg><div class="zb"><button id="zi">+</button><button id="zo">−</button><button id="zr">Fit</button></div></div>`;
 const svg=m.querySelector("svg");draw(pg,svg);const z=panzoom(svg,pg),r=svg.getBoundingClientRect();
 zi.onclick=()=>z.zoom(.75,r.left+r.width/2,r.top+r.height/2);zo.onclick=()=>z.zoom(1.33,r.left+r.width/2,r.top+r.height/2);zr.onclick=z.reset;
 if(pg.id==="overview"){const g=document.createElement("div");g.className="grid";PAGES.slice(1).filter(p=>!crit||TIER(p.id)==="CRITICAL").forEach(p=>{const a=document.createElement("a");a.className="th";a.href="#"+p.id;a.innerHTML=`<b>${p.title} ⤢</b><span class="tb ${TIER(p.id)}">${TIER(p.id)}</span>`;const s=el("svg",{},a);draw(p,s,1);g.appendChild(a)});m.appendChild(g);
  m.insertAdjacentHTML("beforeend",`<div class="box"><b>How to read these drawings</b>: wires that cross without connecting have a small <b>hop</b> (arc); a <b>filled dot</b> is a real junction (same terminal). No dot = no connection.</div><div class="box"><b>View</b>: Critical only shows the pages needed for a safe first drive; LATER pages: ${PAGES.slice(1).filter(p=>TIER(p.id)==="LATER").map(p=>p.title+" ("+esc(((INSTALL[p.id]||{}).why)||"")+")").join("; ")}</div><div class="box"><b>Proposed wire colour code</b> <span class="bad">PROPOSED — not in the docs</span> (only the BICM harness colours are sourced): `+Object.entries(COLORS).map(([k,v])=>`${k} = ${v}`).join(" · ")+`</div><div class="box"><b>Conflicts found (fix before wiring)</b><ul>${CONFLICTS.map(c=>`<li>${c}</li>`).join("")}</ul></div>`)}
 if(pg.id!=="overview"){m.insertAdjacentHTML("beforeend",`<div class="box">${guide(pg)}</div>`);m.querySelectorAll("[data-node]").forEach(li=>li.onclick=()=>{svg.querySelectorAll(".n.hl").forEach(x=>x.classList.remove("hl"));const g=svg.querySelector(`.n[data-id="${li.dataset.node}"]`);if(g){g.classList.add("hl");m.querySelector(".view").scrollIntoView({behavior:"smooth"})}})}
 m.insertAdjacentHTML("beforeend",`<h3>Parts &amp; connections (from → to)</h3><div class="tw"><table><tr><th>From</th><th>To</th><th>Signal</th><th>Gauge</th><th>Colour</th><th>Notes</th><th>Status</th></tr>${pg.net.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="${r[3]!=="factory"&&r[4]!=="—"?"bad":""}">${r[4]}${r[3]!=="factory"&&r[4]!=="—"?" (PROPOSED)":" (SOURCED)"}</td><td>${r[5]}</td><td class="${isR(r[6])?"bad":""}">${{S:"SOURCED",P:"PROPOSED",U:"UNVERIFIED"}[r[6]]}</td></tr>`).join("")}</table></div>`);scrollTo(0,0)}
onhashchange=render;document.getElementById("crit").onclick=()=>{crit=!crit;localStorage.setItem("teryx-wiring-crit",crit?"1":"0");render()};document.getElementById("partsb").onclick=openParts;render();
</script></body></html>
